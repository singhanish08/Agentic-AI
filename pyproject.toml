[project]
name = "langchain-learning"
version = "0.1.0"
description = "Learning Langchain"
readme = "README.md"
authors = [
    { name = "Anish Singh", email = "singhanish0008@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.2",
    "python-dotenv>=1.2.4",
]



[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
